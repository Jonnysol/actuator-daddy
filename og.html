<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actuator Daddy — OG card</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=1200">
<link rel="stylesheet" href="css/tokens.css">
<style>
  html,body{margin:0;background:var(--night)}
  body{width:1200px;height:630px;overflow:hidden;position:relative;color:var(--paper);font-family:var(--display)}
  .left{position:absolute;left:72px;top:0;height:630px;display:flex;flex-direction:column;justify-content:center;gap:34px;width:640px}
  .lockup{width:600px;display:block}
  .line{font-family:var(--voice);font-style:italic;font-size:46px;line-height:1.1;margin:0;color:var(--paper)}
  .line em{font-style:normal;color:var(--fog)}
  .url{position:absolute;left:72px;bottom:40px;margin:0;font-family:var(--mono);font-size:19px;letter-spacing:.08em;color:var(--fog)}
  .daddy{position:absolute;right:-30px;top:60px;height:640px;width:auto}
  .rule{position:absolute;left:72px;right:72px;bottom:92px;height:1px;background:var(--steel);opacity:.8}
</style>
</head>
<body>
  <div class="left">
    <img class="lockup" src="brand/lockup.svg" alt="Actuator Daddy">
    <p class="line">The after-hours twin<br>of Verros Robotics.</p>
  </div>
  <img class="daddy" src="assets/daddy-ascii-shadow.png" alt="">
  <div class="rule"></div>
  <p class="url">ACTUATORDADDY.COM · TAKE THAT LOAD</p>
</body>
</html>
